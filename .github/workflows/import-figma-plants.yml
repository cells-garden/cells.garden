name: Import Figma plants

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-figma-plants.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: import-figma-plants
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Diagnose Figma authentication without exposing the token
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [[ "$FIGMA_TOKEN" =~ ^figd_[A-Za-z0-9_-]{40,200}$ ]]; then echo "PAT format: plausible"; else echo "PAT format: unexpected"; fi
          without=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://api.figma.com/v1/me')
          dummy=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'X-Figma-Token: deliberately-invalid' 'https://api.figma.com/v1/me')
          configured=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "X-Figma-Token: $FIGMA_TOKEN" 'https://api.figma.com/v1/me')
          echo "Figma /v1/me: without=$without dummy=$dummy configured=$configured"
      - name: Verify Figma API access
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          curl --fail --silent --show-error --write-out "Figma API HTTP %{http_code}\n" --header "X-Figma-Token: $FIGMA_TOKEN" "https://api.figma.com/v1/files/WJgKfsKcxUpuNkDvxI9gEx" --output /dev/null
      - name: Import plants marked Ready for dev in Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/import-figma-plants.mjs
      - name: Publish new plant assets to dev
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new plants are marked Ready for dev."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/asset-map.json src/core/assets.ts scripts/map-design-assets.mjs src/assets/pack
          git diff --cached --check
          npm run typecheck
          npm run lint
          npm run test:design
          npm run build:web
          git commit -m "Import Figma plants marked Ready for dev"
          git push origin HEAD:dev
