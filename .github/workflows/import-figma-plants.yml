name: Import Figma plants

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      plants:
        description: 'Also import these plants, even if not marked Ready for dev (comma-separated names, e.g. Leafy)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: import-figma-plants
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Import new, redrawn and renamed plants marked Ready for dev in Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # Empty on a scheduled run: then only plants marked Ready for dev come in.
          FIGMA_PLANTS: ${{ inputs.plants }}
        run: |
          node scripts/import-figma-plants.mjs > "$RUNNER_TEMP/figma-import.json"
          cat "$RUNNER_TEMP/figma-import.json"
      - name: Publish new plant assets to dev
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new plants are marked Ready for dev."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/asset-map.json src/core/assets.ts scripts/map-design-assets.mjs src/assets/pack
          git diff --cached --check
          npm run typecheck
          npm run lint
          npm run test:design
          npm run build:web
          # The commit title is what the site's "What's new" shows.
          title="$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(r.title || "Import Figma plants marked Ready for dev")' "$RUNNER_TEMP/figma-import.json")"
          git commit -m "$title" -m "Imported from Figma, where it was marked Ready for dev."
          git push origin HEAD:dev
