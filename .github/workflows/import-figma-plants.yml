name: Import Figma plants

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: import-figma-plants
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify Figma credentials
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.FIGMA_TOKEN || '';
          if (!/^figd_[A-Za-z0-9_-]{40,200}$/.test(token)) {
            console.error('FIGMA_TOKEN is not a valid Figma personal access token. Replace the Actions secret with a new file_content:read token from Figma Settings > Security.');
            process.exit(1);
          }
          const response = await fetch('https://api.figma.com/v1/files/WJgKfsKcxUpuNkDvxI9gEx?depth=1', { headers: { 'X-Figma-Token': token } });
          if (!response.ok) {
            console.error('Figma file read failed: HTTP ' + response.status);
            process.exit(1);
          }
          console.log('Figma access verified.');
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Import plants marked Ready for dev
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          node scripts/import-figma-plants.mjs > "$RUNNER_TEMP/figma-import.json"
          cat "$RUNNER_TEMP/figma-import.json"
      - name: Validate and publish to dev
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new Ready-for-dev plants."
            exit 0
          fi
          git add design/asset-map.json src/core/assets.ts scripts/map-design-assets.mjs src/assets/pack
          git diff --cached --check
          npm run typecheck
          npm run lint
          npm run test:design
          npm run build:web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The commit title is what the site's "What's new" shows.
          title="$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const n = (r.imported || []).map(p => p.name); console.log(n.length === 1 ? "New plant: " + n[0] : n.length ? "New plants: " + n.slice(0, -1).join(", ") + " and " + n[n.length - 1] : "Import Figma plants marked Ready for dev")' "$RUNNER_TEMP/figma-import.json")"
          git commit -m "$title" -m "Imported from Figma, where it was marked Ready for dev."
          git push origin HEAD:dev
